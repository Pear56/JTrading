name: Daily RSI Check

on:
  push:
    branches: [ "main" ]
  schedule:
    # 周一到周五北京时间 12:18、13:18、14:18、15:18 运行 (UTC 04:18 - 07:18)
    - cron: '18 4-7 * * 1-5'
  workflow_dispatch: # 允许手动触发

jobs:
  check-rsi:
    runs-on: ubuntu-24.04
    permissions:
      contents: write  # 授予写入权限以推送到 gh-pages 分支
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas numpy akshare

    - name: Run RSI Check
      env:
        SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
        SUBSCRIBER_EMAILS: ${{ secrets.SUBSCRIBER_EMAILS }}
        GIST_SUBSCRIBERS_URL: ${{ secrets.GIST_SUBSCRIBERS_URL }}
        GIST_TOKEN: ${{ secrets.GIST_TOKEN || secrets.GIST_TOKEN_WRITE }}
        GIST_ID: ${{ secrets.GIST_ID }}
        GIST_FILENAME: ${{ secrets.GIST_FILENAME }}
        SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
        SUBSCRIBE_WORKER_URL: ${{ secrets.SUBSCRIBE_WORKER_URL }}
        FORMSPREE_ID: ${{ secrets.FORMSPREE_ID }}
        # 如果使用非QQ邮箱，可以在 Secrets 中配置 SMTP_SERVER 和 SMTP_PORT
        # SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
        # SMTP_PORT: ${{ secrets.SMTP_PORT }}
      run: python github_action_runner.py

    - name: Generate config.js with secrets
      env:
        SUBSCRIBE_WORKER_URL: ${{ secrets.SUBSCRIBE_WORKER_URL }}
        FORMSPREE_ID: ${{ secrets.FORMSPREE_ID }}
      run: |
        # 生成包含实际配置的 config.js
        cat > docs/config.js << EOF
        // 自动生成的配置文件 - 请勿手动编辑
        // Generated by GitHub Actions
        const CONFIG = {
          WORKER_URL: '${SUBSCRIBE_WORKER_URL}',
          FORMSPREE_ID: '${FORMSPREE_ID}'
        };
        EOF

    - name: Commit changes to docs folder
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add docs/data.json docs/config.js
        if [ -f docs/dynamic_data.json ]; then
          git add docs/dynamic_data.json
        fi
        git diff --staged --quiet || git commit -m "Update RSI data [skip ci]"
        git push
